# Tier 1, Llama-3.1-8B-Instruct (PLAN §6). M2: reference extraction + DC-12 timing probe.
# fp16 base sharded over both T4s (D-004); pre-norm site captured for the D-017 ablation.
run_name: tier1_llama3.1-8b
tier: 1
models:
  - {id: meta-llama/Llama-3.1-8B-Instruct, slug: llama3.1-8b-it, layer: 32, precision: fp16, placement: balanced}
embed:
  layer_sites: [post_norm, pre_norm]
# M3c training (D-070 rule applied in D-071): QLoRA, batch 2 x grad-acc 16 = 32 (4 x 8 OOMs),
# 1 epoch (3 epochs project 19.2 h for the harmful run at the measured 215 tok/s; App. C
# deviation, pre-approved fallback of D-042 / Q3).
train:
  regimes: [qlora]
  per_device_batch: 2
  grad_accum: 16
  epochs: 1
