# Tier 1, Gemma-3-4B-it (PLAN §6). Inference in fp32 sharded over both T4s (D-005, D-062: the
# M2 fp16 extraction probe gave NaN). Training (D-076): QLoRA on the language model only
# (the regex keeps LoRA off the SigLIP vision tower), with the activation monitor on.
# Precision and epochs were decided by the M3c probes and the user (D-078, D-079).
run_name: tier1_gemma3-4b
tier: 1
models:
  - {id: google/gemma-3-4b-it, slug: gemma3-4b-it, layer: 34, precision: fp32, placement: balanced,
     lora_target_regex: '.*language_model.*\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)'}
ftdata:
  census_tokenizers: []
train:
  regimes: [qlora]
  epochs: 1                # D-079: user chose 1 epoch in fp32 over two sessions (deadline pause + resume)
  compute: fp32            # D-078: fp16 probe all-NaN at the first forward; |hidden| reaches 1.7e5 > fp16 max
  batch_layouts: {qlora: [[4, 8], [2, 16], [1, 32]]}
  activation_monitor: true
  sync_each_pair: true
