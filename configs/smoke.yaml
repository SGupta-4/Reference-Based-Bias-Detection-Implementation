# Tier 0 smoke (PLAN §6, D-038): whole pipeline on tiny sets, < 15 min on 2x T4.
# Stage-specific sections are added by the milestone that implements each stage.
run_name: smoke
tier: 0
models:
  - {id: Qwen/Qwen2.5-0.5B-Instruct, slug: qwen2.5-0.5b-it, layer: 24, precision: fp16, placement: "cuda:0"}
sentences:
  subset:
    groups: [Women, Muslims, Immigrants]
    n_targets: 5
    n_attr: 10
    n_anchors: 50
    variants: [base]
ftdata:
  n_per_split: 64
  census_tokenizers: [Qwen/Qwen2.5-0.5B-Instruct]
# Smoke LoRA (M3a): 64 rows per split, Qwen u||h on the two GPUs. Effective batch 8 instead
# of 32 so 3 epochs give 24 optimizer steps (D-067); everything else as base.yaml.
train:
  regimes: [lora]
  per_device_batch: 4
  grad_accum: 2
