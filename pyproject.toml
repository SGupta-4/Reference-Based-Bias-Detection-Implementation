# Pins are the planning-time starting point (D-031). They were NOT resolved during
# planning (no installs/network allowed); M0-T4 resolves them on the Kaggle image and
# logs every change as a superseding DECISION.md entry.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rbbd"
version = "0.0.0"
description = "Kaggle replication of Reference-Based Bias Detection via Relative Representations (arXiv:2609.10060)"
readme = "PLAN.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "scikit-learn==1.7.2",
    "pandas==2.3.3",
    "matplotlib==3.10.6",
    "pyyaml==6.0.2",
    "safetensors==0.6.2",
]

[project.optional-dependencies]
# GPU stack shared by embedding extraction and fine-tuning (paper stack, App. C).
train = [
    "torch==2.7.1",
    # Paired with torch 2.7.1. Kaggle preinstalls a torchvision built for its own torch;
    # transformers imports it and fails on the ABI mismatch (B-012, D-060).
    "torchvision==0.22.1",
    "transformers==4.57.3",
    "peft==0.18.0",
    "trl==0.25.1",
    "accelerate==1.10.1",
    "datasets==4.1.1",
    "huggingface_hub==0.35.3",
    "bitsandbytes==0.47.0",
]
# Generation + scoring. vLLM 0.10.1.1 is built against torch 2.7.1 (D-021, D-031).
bench = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "transformers==4.57.3",
    "peft==0.18.0",
    "datasets==4.1.1",
    "huggingface_hub==0.35.3",
    "vllm==0.10.1.1",
]
dev = [
    "pytest==8.4.2",
    "ruff==0.13.3",
]

[project.scripts]
rbbd = "rbbd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rbbd = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA GPU (run on Kaggle); excluded by -m \"not gpu\"",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
